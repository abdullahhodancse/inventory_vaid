{% extends 'base.html' %}
{% load static %}

{% block title %}Choose Subscription Plan{% endblock %}

{% block content %}
<style>
    body { background-color: #f4f6f9; font-family: 'Poppins', sans-serif; }
    .subscription-container {
        max-width: 600px; margin: 60px auto; background: #fff;
        border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        padding: 30px 40px;
    }
    .plan-option { border: 2px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 15px;
        cursor: pointer; transition: all 0.3s; }
    .plan-option:hover { border-color: #007bff; background: #f1f8ff; }
    .plan-option input[type="radio"] { accent-color: #007bff; transform: scale(1.3); margin-right: 10px; }
    .btn-submit { width: 100%; border-radius: 10px; padding: 10px; font-size: 16px; }
</style>

<div class="subscription-container">
    <h3 class="text-center mb-4 text-primary fw-bold">
        <i class="bi bi-stars me-2"></i>Choose Your Subscription Plan
    </h3>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label class="form-label fw-bold mb-2">Select Plan:</label>

            {% for plan in plans %}
            <div class="plan-option d-flex align-items-center">
                <input type="radio" name="name" value="{{ plan.name }}" id="{{ plan.name }}" required>
                <label for="{{ plan.name }}" class="m-0">
                    <strong>{{ plan.name }}</strong> — ৳{{ plan.price }} / {{ plan.duration_days }} days
                    <br><small>Max Categories: {{ plan.max_catagoty}}, Max Items: {{ plan.max_inventory}}</small>
                </label>
            </div>
            {% endfor %}
        </div>

        <button type="submit" class="btn btn-primary btn-submit mt-3">
            <i class="bi bi-check-circle me-1"></i> Confirm Subscription
        </button>
    </form>
</div>
{% endblock %}
