{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="container mt-5 col-md-6 mx-auto">
  <div class="card shadow rounded-4 p-4 text-center">
    <h3>Password Reset Successful</h3>
    <p>Your password has been updated successfully. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary mt-3">Login</a>
  </div>
</div>
{% endblock %}
